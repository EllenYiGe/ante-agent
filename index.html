<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>ANTE: Anticipate, Then Execute</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500&family=Source+Serif+4:opsz,wght@8..60,600&display=swap">
<style>
:root{--bg:#FFFFFF;--ink:#232F3E;--muted:#5C6773;--accent:#B35900}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "IBM Plex Sans",system-ui,sans-serif;display:grid;place-items:center;padding:24px}
main{text-align:center}
h1{font:600 clamp(40px,9vw,64px)/1.05 "Source Serif 4",Georgia,serif;letter-spacing:-.015em;margin:0}
p.sub{font:600 clamp(17px,3.6vw,22px)/1.3 "Source Serif 4",Georgia,serif;margin:10px 0 18px}
p.soon{margin:0;color:var(--muted);font-size:14px;letter-spacing:.14em;text-transform:uppercase}
p.soon b{color:var(--accent);font-weight:500}
</style>
</head>
<body>
<main>
  <h1>ANTE</h1>
  <p class="sub">Anticipate, Then Execute</p>
  <p class="soon"><b>Project page</b> coming soon</p>
</main>
</body>
</html>
